<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Signal Engine{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23ff6b1a'/%3E%3Cpath d='M6 16l3-8 3 6 3-4 3 6' stroke='white' stroke-width='1.8' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <meta name="color-scheme" content="dark light">
  <script>
    (function () {
      var saved = localStorage.getItem("signal-engine-theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    })();
  </script>
</head>
<body>
  <div class="shell">
    <aside class="shell-sidebar" aria-label="Primary">
      <a class="brand" href="/digest">
        <span class="brand-mark">SE</span>
        <span>
          <div>signal-engine</div>
          <div class="brand-meta">v0.2.0 · local</div>
        </span>
      </a>
      <nav class="nav-section" aria-label="Pages">
        <div class="nav-section-title">Today</div>
        <a class="nav-link" href="/digest" {% if request.url.path == '/digest' or request.url.path == '/' %}aria-current="page"{% endif %}>Digest</a>
        <a class="nav-link" href="/pains" {% if request.url.path.startswith('/pains') %}aria-current="page"{% endif %}>Pain clusters</a>
        <a class="nav-link" href="/eval" {% if request.url.path.startswith('/eval') %}aria-current="page"{% endif %}>Eval queue</a>
        <div class="nav-section-title">Explore</div>
        <a class="nav-link" href="/search" {% if request.url.path.startswith('/search') %}aria-current="page"{% endif %}>Search</a>
        <a class="nav-link" href="/status" {% if request.url.path == '/status' %}aria-current="page"{% endif %}>Status</a>
      </nav>
      <div style="margin-top:auto; display:flex; flex-direction:column; gap:.5rem;">
        <a class="nav-link" href="https://github.com/10xdev4u-alt/signal-engine" rel="noreferrer" target="_blank">
          <span style="font-size:.85rem">↗</span> Source
        </a>
        <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
          <span id="theme-icon">☾</span>
        </button>
      </div>
    </aside>
    <div class="shell-main">
      <header class="topbar">
        <nav class="crumbs" aria-label="Breadcrumb">
          {% block crumbs %}
            <a href="/digest">signal-engine</a>
          {% endblock %}
        </nav>
        <a class="search-pill" href="/search">
          <span>Search collected data…</span>
          <kbd>Ctrl K</kbd>
        </a>
      </header>
      <main class="content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById("theme-toggle");
      var icon = document.getElementById("theme-icon");
      if (!btn) return;
      function paint() {
        icon.textContent = root.getAttribute("data-theme") === "light" ? "☀" : "☾";
      }
      paint();
      btn.addEventListener("click", function () {
        var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
        root.setAttribute("data-theme", next);
        localStorage.setItem("signal-engine-theme", next);
        paint();
      });
      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          window.location.href = "/search";
        }
      });
    })();
  </script>
  {% block extra_js %}{% endblock %}
</body>
</html>
